version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mental_health_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mental_health_2025
      POSTGRES_DB: mental_health_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - mental_health_network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: mental_health_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mental_health_network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: mental_health_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=mental_health_db
      - DB_USER=postgres
      - DB_PASSWORD=mental_health_2025
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    networks:
      - mental_health_network

  # ML Services (Python)
  ml-service:
    build:
      context: ./ml-services
      dockerfile: ../deploy/Dockerfile.ml
    container_name: mental_health_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:mental_health_2025@postgres:5432/mental_health_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./ml-services:/app
    networks:
      - mental_health_network

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: mental_health_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - REACT_APP_SOCKET_URL=http://localhost:5000
      - REACT_APP_ML_SERVICE_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mental_health_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mental_health_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - ml-service
    networks:
      - mental_health_network

  # Data Processing Service (Optional)
  data-processor:
    build:
      context: ./ml-services
      dockerfile: ../deploy/Dockerfile.ml
    container_name: mental_health_data_processor
    restart: "no"
    command: python data_processor.py
    environment:
      - DATABASE_URL=postgresql://postgres:mental_health_2025@postgres:5432/mental_health_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data:ro
      - ./ml-services:/app
      - processed_data:/app/processed
    networks:
      - mental_health_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  processed_data:
    driver: local

networks:
  mental_health_network:
    driver: bridge